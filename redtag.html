<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조작대상 찾기</title>
<!-- 아이콘만 맞춰 준다. 설치 대상(manifest)은 index.html 하나로 유지한다. -->
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --primary:#ff385c; --primary-active:#e00b41; --error:#c13515;
    --ink:#222222; --muted:#6a6a6a; --hairline:#dddddd;
    --canvas:#ffffff; --surface-soft:#f7f7f7; --surface-strong:#f2f2f2;
    --radius-sm:8px; --radius-md:14px; --radius-full:9999px;
    /* 보관함 계열 색 — index.html 과 같은 값 */
    --archive:#0b6bab; --archive-soft:#eff6fb; --archive-line:#bcd9ec;
    --elevation:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:"Airbnb Cereal VF",Circular,-apple-system,system-ui,Roboto,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--canvas); color:var(--ink); -webkit-tap-highlight-color:transparent;
  }
  .shell{ max-width:900px; margin:0 auto; padding:0 16px 40px; }
  .head-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0 10px; }
  .head-logo{ height:30px; width:auto; display:block; }
  .head-banner{ height:22px; width:auto; display:block; }
  h1{ font-size:26px; font-weight:800; letter-spacing:-0.6px; text-align:center; margin:0 0 10px; }
  .top-links{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:0 0 18px; }
  .chip{ font-size:14px; font-weight:600; color:var(--ink); background:var(--surface-soft); border:1px solid var(--hairline); border-radius:var(--radius-full); padding:8px 16px; cursor:pointer; text-decoration:none; }

  /* ---- 검색 ---- */
  .finder{ border:1px solid var(--hairline); border-radius:var(--radius-md); padding:14px; margin:0 0 16px; background:var(--surface-soft); }
  .finder-row{ display:flex; gap:8px; }
  .finder-row input{ flex:1; min-width:0; height:46px; padding:0 13px; font-family:inherit; font-size:16px;
    border:1px solid var(--hairline); border-radius:var(--radius-sm); background:var(--canvas); color:var(--ink); }
  .finder-row button{ flex:none; height:46px; padding:0 20px; font-family:inherit; font-size:15px; font-weight:700;
    border:1px solid var(--archive); background:var(--archive); color:#fff; border-radius:var(--radius-sm); cursor:pointer; }
  .finder-hint{ font-size:13px; color:var(--muted); margin:10px 0 0; line-height:1.5; }
  /* 켜 두면 새로 검색해도 담아 둔 것이 사라지지 않는다. 여러 번 찾아 쌓는 게
     기본 쓰임이라 처음부터 켜 둔다. */
  .keep-row{ display:flex; align-items:center; gap:8px; margin:12px 0 0; }
  .keep-row input{ width:20px; height:20px; accent-color:var(--archive); }
  .keep-row label{ font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; }

  .status{ font-size:14px; color:var(--muted); margin:0 0 12px; min-height:20px; }
  .status.error{ color:var(--error); }

  /* ---- 표 ---- */
  .sec{ margin:0 0 26px; }
  .sec-head{ display:flex; align-items:center; gap:10px; margin:0 0 10px; flex-wrap:wrap; }
  .sec-head h2{ font-size:17px; font-weight:800; margin:0; }
  .sec-count{ font-size:13px; font-weight:700; color:#fff; background:var(--archive); border-radius:var(--radius-full); padding:2px 10px; }
  .sec-actions{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .sec-actions button{ height:38px; padding:0 14px; font-family:inherit; font-size:13px; font-weight:700;
    border-radius:var(--radius-sm); border:1px solid var(--ink); background:var(--canvas); color:var(--ink); cursor:pointer; }
  .sec-actions .go{ border-color:var(--archive); background:var(--archive); color:#fff; }
  .sec-actions .danger{ border-color:var(--error); color:var(--error); }

  /* 가로로 긴 표라 좁은 화면에서는 표만 좌우로 민다 */
  .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--hairline); border-radius:var(--radius-md); }
  table{ width:100%; border-collapse:collapse; font-size:14px; min-width:620px; }
  th,td{ padding:10px 10px; border-bottom:1px solid var(--hairline); text-align:left; vertical-align:middle; }
  th{ background:var(--surface-strong); font-weight:700; font-size:13px; white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  td.nowrap, th.nowrap{ white-space:nowrap; }
  .col-pick{ width:46px; text-align:center; }
  .col-pick input{ width:20px; height:20px; accent-color:var(--archive); }
  .op{ font-weight:700; }
  .op.open{ color:var(--error); }
  .op.close{ color:var(--archive); }
  .muted{ color:var(--muted); }
  .empty{ padding:22px 14px; text-align:center; color:var(--muted); font-size:14px; }

  /* 담은 목록은 손으로 고칠 수 있어야 한다 */
  .cell-input{ width:100%; min-width:92px; padding:7px 8px; font-family:inherit; font-size:14px;
    border:1px solid transparent; border-radius:var(--radius-sm); background:transparent; color:var(--ink); }
  .cell-input:focus{ outline:none; border-color:var(--archive); background:var(--canvas); }
  .cell-input::placeholder{ color:#b5b5b5; }
  select.cell-input{ background:var(--canvas); border-color:var(--hairline); }
  .row-btns{ display:flex; gap:6px; white-space:nowrap; }
  .row-btns button{ width:32px; height:32px; padding:0; font-family:inherit; font-size:15px; font-weight:700;
    border:1px solid var(--hairline); background:var(--canvas); color:var(--muted); border-radius:var(--radius-sm); cursor:pointer; }
  .row-btns .del{ border-color:var(--error); color:var(--error); }

  .gate{ border:1px solid var(--hairline); border-radius:var(--radius-md); padding:20px; }
  .gate h2{ font-size:16px; font-weight:600; margin:0 0 6px; }
  .gate p{ font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 14px; }
  .hidden{ display:none !important; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(14px);
    background:rgba(0,0,0,.86); color:#fff; font-size:14px; font-weight:600; padding:12px 18px;
    border-radius:var(--radius-full); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    max-width:88vw; text-align:center; z-index:900; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="shell">
  <div class="head-row">
    <img src="manual-logo.gif" alt="한국지역난방공사" class="head-logo">
    <img src="banner.png" alt="깨끗한 에너지로 세상을 따뜻하게" class="head-banner">
  </div>
  <h1>조작대상 찾기</h1>
  <div class="top-links">
    <a class="chip" href="index.html">← 문서 작성으로</a>
  </div>

  <!-- 연결이 안 됐을 때 -->
  <div class="gate hidden" id="notConfigured">
    <h2>조작대상 데이터에 연결되지 않았습니다</h2>
    <p>
      <code>supabase-config.js</code> 의 <code>REDTAG_CONFIG</code> 에 주소와 키를 넣고,
      <code>db/redtag-01-schema.sql</code> 부터 번호대로 실행해 주세요.
    </p>
  </div>

  <div id="main" class="hidden">
    <!-- 검색 -->
    <div class="finder">
      <div class="finder-row">
        <input type="search" id="q" placeholder="기기명 또는 기기번호" autocomplete="off"
               enterkeyhint="search" aria-label="기기명 또는 기기번호">
        <button type="button" id="searchBtn">찾기</button>
      </div>
      <div class="keep-row">
        <input type="checkbox" id="keepPrev" checked>
        <label for="keepPrev">기존 검색정보 유지 — 여러 번 찾아 담기</label>
      </div>
      <p class="finder-hint">
        점검할 기기를 찾으면, 그 기기를 점검하려고 조작해야 할 차단기가 위치와 함께 나옵니다.
      </p>
    </div>

    <p class="status" id="status"></p>

    <!-- 검색 결과 -->
    <div class="sec">
      <div class="sec-head">
        <h2>검색 결과</h2>
        <span class="sec-count" id="foundCount" hidden>0</span>
        <div class="sec-actions">
          <button type="button" id="pickAllBtn">전체 선택</button>
          <button type="button" class="go" id="addPickedBtn">담기</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-pick"><input type="checkbox" id="pickHead" aria-label="전체 선택"></th>
              <th>위치</th><th>그룹</th><th>차단기명</th>
              <th class="nowrap">조작</th><th>점검대상</th>
            </tr>
          </thead>
          <tbody id="foundBody">
            <tr><td colspan="6" class="empty">기기명을 찾아 보세요.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 담은 목록 -->
    <div class="sec">
      <div class="sec-head">
        <h2>작업 리스트</h2>
        <span class="sec-count" id="listCount">0</span>
        <div class="sec-actions">
          <button type="button" id="addBlankBtn">빈 행 추가</button>
          <button type="button" class="danger" id="clearBtn">전체 비우기</button>
          <button type="button" class="go" id="exportBtn">엑셀 받기</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="nowrap">No.</th>
              <th>위치</th><th>그룹</th><th>차단기명</th>
              <th class="nowrap">조작</th><th>점검대상</th>
              <th class="nowrap">행</th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="libs/supabase.min.js"></script>
<script src="libs/exceljs.min.js"></script>
<script src="supabase-config.js"></script>
<script src="redtag.js"></script>
<script>
(function(){
  'use strict';

  var el = function(id){ return document.getElementById(id); };
  var statusEl = el('status');
  var toastEl = el('toast');
  var foundBody = el('foundBody');
  var listBody = el('listBody');

  var found = [];   // 이번 검색 결과
  var list = [];    // 담아 둔 작업 리스트 (엑셀로 나가는 것)

  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 3000);
  }

  function setStatus(msg, isError){
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }

  function opClass(op){
    if(op === '개방') return 'op open';
    if(op === '투입') return 'op close';
    return 'op';
  }

  /* ---- 검색 ------------------------------------------------------------- */

  function runSearch(){
    var term = el('q').value.trim();
    if(!term){ setStatus('기기명이나 기기번호를 입력해 주세요.', true); return; }

    setStatus('찾는 중입니다...');
    el('searchBtn').disabled = true;
    RedTag.search(term).then(function(rows){
      el('searchBtn').disabled = false;
      found = rows;
      renderFound();
      if(!rows.length){
        setStatus('"' + term + '" 로 찾은 기기가 없습니다. 이름 일부만 넣어 보세요.');
        return;
      }
      var names = {};
      rows.forEach(function(r){ names[r.equipmentName] = 1; });
      setStatus('기기 ' + Object.keys(names).length + '건 · 조작대상 ' + rows.length + '건을 찾았습니다.');
    }).catch(function(err){
      el('searchBtn').disabled = false;
      console.error(err);
      setStatus('찾지 못했습니다: ' + ((err && err.message) || '알 수 없는 오류'), true);
    });
  }

  function renderFound(){
    var cnt = el('foundCount');
    cnt.hidden = !found.length;
    cnt.textContent = found.length;
    el('pickHead').checked = false;

    if(!found.length){
      foundBody.innerHTML = '<tr><td colspan="6" class="empty">찾은 조작대상이 없습니다.</td></tr>';
      return;
    }
    foundBody.innerHTML = '';
    found.forEach(function(r, i){
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="col-pick"><input type="checkbox" data-i="' + i + '" aria-label="선택"></td>' +
        '<td class="loc"></td><td class="grp muted"></td><td class="dev"></td>' +
        '<td class="nowrap"><span class="' + opClass(r.operation) + '"></span></td>' +
        '<td class="eq muted"></td>';
      tr.querySelector('.loc').textContent = r.location || '—';
      tr.querySelector('.grp').textContent = r.groupName || '—';
      tr.querySelector('.dev').textContent = r.deviceName;
      tr.querySelector('.op').textContent = r.operation || '—';
      tr.querySelector('.eq').textContent = r.equipmentName;
      foundBody.appendChild(tr);
    });
  }

  function pickedRows(){
    var out = [];
    foundBody.querySelectorAll('input[type="checkbox"]:checked').forEach(function(box){
      var r = found[Number(box.dataset.i)];
      if(r) out.push(r);
    });
    return out;
  }

  /* ---- 담은 목록 --------------------------------------------------------- */

  function blankRow(){
    return { location:'', groupName:'', deviceName:'', operation:'', equipmentName:'' };
  }

  // 같은 기기·같은 차단기를 두 번 담지 않는다
  function sameAs(a, b){
    return a.deviceName === b.deviceName && a.equipmentName === b.equipmentName;
  }

  function addPicked(){
    var picked = pickedRows();
    if(!picked.length){ showToast('담을 항목을 먼저 선택해 주세요.'); return; }

    var added = 0, dup = 0;
    picked.forEach(function(r){
      var exists = list.some(function(x){ return sameAs(x, r); });
      if(exists){ dup++; return; }
      list.push({
        location: r.location,
        groupName: r.groupName,
        deviceName: r.deviceName,
        operation: r.operation,
        equipmentName: r.equipmentName
      });
      added++;
    });
    renderList();

    /* "기존 검색정보 유지" 가 꺼져 있으면 담은 뒤 검색 결과를 비운다.
       켜져 있으면 그대로 두어 계속 골라 담을 수 있다. */
    if(!el('keepPrev').checked){
      found = [];
      renderFound();
      el('q').value = '';
    }else{
      foundBody.querySelectorAll('input[type="checkbox"]').forEach(function(b){ b.checked = false; });
      el('pickHead').checked = false;
    }
    showToast(added + '건 담았습니다.' + (dup ? ' (이미 담은 ' + dup + '건 제외)' : ''));
  }

  function renderList(){
    el('listCount').textContent = list.length;
    if(!list.length){
      listBody.innerHTML = '<tr><td colspan="7" class="empty">아직 담은 항목이 없습니다. 검색해서 담거나 빈 행을 추가해 손으로 적으세요.</td></tr>';
      return;
    }
    listBody.innerHTML = '';
    list.forEach(function(r, i){
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="nowrap">' + (i + 1) + '</td>' +
        '<td><input class="cell-input" data-f="location"      placeholder="위치"></td>' +
        '<td><input class="cell-input" data-f="groupName"     placeholder="그룹"></td>' +
        '<td><input class="cell-input" data-f="deviceName"    placeholder="차단기명"></td>' +
        '<td><select class="cell-input" data-f="operation">' +
          '<option value="">선택</option><option value="개방">개방</option><option value="투입">투입</option>' +
        '</select></td>' +
        '<td><input class="cell-input" data-f="equipmentName" placeholder="점검대상"></td>' +
        '<td><div class="row-btns">' +
          '<button type="button" class="up"   title="위로">↑</button>' +
          '<button type="button" class="ins"  title="아래에 빈 행">+</button>' +
          '<button type="button" class="del"  title="삭제">✕</button>' +
        '</div></td>';

      tr.querySelectorAll('[data-f]').forEach(function(input){
        var f = input.dataset.f;
        input.value = r[f] || '';
        input.addEventListener('input', function(){ list[i][f] = input.value; });
        input.addEventListener('change', function(){ list[i][f] = input.value; });
      });
      tr.querySelector('.up').addEventListener('click', function(){
        if(i === 0) return;
        var t = list[i - 1]; list[i - 1] = list[i]; list[i] = t;
        renderList();
      });
      tr.querySelector('.ins').addEventListener('click', function(){
        list.splice(i + 1, 0, blankRow());
        renderList();
      });
      tr.querySelector('.del').addEventListener('click', function(){
        list.splice(i, 1);
        renderList();
      });
      listBody.appendChild(tr);
    });
  }

  /* ---- 엑셀 ------------------------------------------------------------- */

  /* Red-Tag 관리대장 양식(redtag-template.xlsx)을 그대로 열어 세 칸만 채운다.
     나머지(BAR CODE·시운전·상태·비고 등)는 받는 분이 손으로 적는 자리라 비워 둔다.
     서식·병합·유효성검사를 살리려고 새로 만들지 않고 템플릿을 고쳐 쓴다. */
  var SHEET_YANGSAN = 'Tag 대장(양산 열원)';
  var SHEET_SASONG  = 'TAG 대장(사송 가압장)';
  var FIRST_ROW = 8;            // 1=제목, 5=머리글, 7=보조 머리글, 8부터 내용
  var COL = { no:1, number:2, name:3, cut:6 };   // A, B, C, F

  function fillSheet(ws, rows){
    if(!rows.length) return;
    rows.forEach(function(r, i){
      var rowNo = FIRST_ROW + i;
      var row = ws.getRow(rowNo);
      /* 템플릿에 미리 꾸며 둔 줄보다 많아지면 서식이 없는 맨 줄이 된다.
         그때는 첫 줄의 서식을 그대로 베껴 와 표가 끊겨 보이지 않게 한다. */
      if(rowNo > ws.rowCount || !row.getCell(COL.no).style || !row.getCell(COL.no).border){
        var src = ws.getRow(FIRST_ROW);
        row.height = src.height;
        for(var c = 1; c <= 18; c++){
          row.getCell(c).style = JSON.parse(JSON.stringify(src.getCell(c).style || {}));
        }
      }
      row.getCell(COL.no).value     = i + 1;
      row.getCell(COL.number).value = r.deviceName || '';
      row.getCell(COL.name).value   = (r.equipmentName ? r.equipmentName + ' 점검 관련 ' : '') + (r.deviceName || '');
      row.getCell(COL.cut).value    = RedTag.operationEnglish(r.operation);
      row.commit && row.commit();
    });
  }

  function exportExcel(){
    if(!list.length){ showToast('담은 항목이 없습니다.'); return; }
    var btn = el('exportBtn');
    btn.disabled = true;
    setStatus('엑셀을 만드는 중입니다...');

    var yangsan = list.filter(function(r){ return !RedTag.isSasong(r); });
    var sasong  = list.filter(function(r){ return RedTag.isSasong(r); });

    fetch('redtag-template.xlsx').then(function(res){
      if(!res.ok) throw new Error('양식 파일(redtag-template.xlsx)을 찾지 못했습니다.');
      return res.arrayBuffer();
    }).then(function(buf){
      var wb = new ExcelJS.Workbook();
      return wb.xlsx.load(buf).then(function(){
        var wsY = wb.getWorksheet(SHEET_YANGSAN);
        var wsS = wb.getWorksheet(SHEET_SASONG);
        if(!wsY || !wsS) throw new Error('양식의 시트 이름이 바뀌었습니다.');
        fillSheet(wsY, yangsan);
        fillSheet(wsS, sasong);
        return wb.xlsx.writeBuffer();
      });
    }).then(function(out){
      var blob = new Blob([out], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Red-Tag 관리대장_' + stamp() + '.xlsx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

      btn.disabled = false;
      setStatus('');
      showToast('양산 ' + yangsan.length + '건 · 사송 ' + sasong.length + '건으로 받았습니다.');
    }).catch(function(err){
      btn.disabled = false;
      console.error(err);
      setStatus('엑셀을 만들지 못했습니다: ' + ((err && err.message) || '알 수 없는 오류'), true);
    });
  }

  function stamp(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  }

  /* ---- 이어 붙이기 -------------------------------------------------------- */

  el('searchBtn').addEventListener('click', runSearch);
  el('q').addEventListener('keydown', function(e){ if(e.key === 'Enter') runSearch(); });

  el('pickHead').addEventListener('change', function(){
    var on = el('pickHead').checked;
    foundBody.querySelectorAll('input[type="checkbox"]').forEach(function(b){ b.checked = on; });
  });
  el('pickAllBtn').addEventListener('click', function(){
    var boxes = foundBody.querySelectorAll('input[type="checkbox"]');
    if(!boxes.length) return;
    var on = !el('pickHead').checked;
    el('pickHead').checked = on;
    boxes.forEach(function(b){ b.checked = on; });
  });
  el('addPickedBtn').addEventListener('click', addPicked);

  el('addBlankBtn').addEventListener('click', function(){
    list.push(blankRow());
    renderList();
  });
  el('clearBtn').addEventListener('click', function(){
    if(!list.length) return;
    if(!window.confirm('담아 둔 ' + list.length + '건을 모두 비울까요?')) return;
    list = [];
    renderList();
  });
  el('exportBtn').addEventListener('click', exportExcel);

  // 담은 것이 있는데 실수로 창을 닫는 일을 막는다
  window.addEventListener('beforeunload', function(e){
    if(!list.length) return;
    e.preventDefault();
    e.returnValue = '';
  });

  // ---- 시작 ----
  if(!window.RedTag || !RedTag.isEnabled()){
    el('notConfigured').classList.remove('hidden');
  }else{
    el('main').classList.remove('hidden');
    renderList();
    el('q').focus();
  }
})();
</script>
</body>
</html>
