<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뚝 DOC 시연 영상</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  /* 브라우저는 사용자가 무언가를 누르기 전에는 전체화면 전환을 허용하지 않는다.
     (자동 전체화면은 광고 악용 때문에 모든 브라우저가 막아 둔 규칙이다.)
     그래서 두 가지로 나눠 해결한다.
       1) 열자마자 재생기가 화면을 꽉 채우게 해서 이미 전체화면처럼 보이게 하고
       2) 진짜 전체화면은 큼직한 버튼 한 번으로 끝나게 한다. */
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  .stage{ position:fixed; inset:0; background:#000; }
  .stage iframe{ width:100%; height:100%; border:0; display:block; }

  /* 재생기 위에 겹쳐 두되, 재생 조작을 가리지 않도록 아래쪽 가운데에만 둔다. */
  .fs-btn{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:8px;
    padding:13px 22px; border:0; border-radius:9999px;
    background:rgba(0,0,0,.72); color:#fff;
    font-family:-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px; font-weight:700; cursor:pointer;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    box-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  .fs-btn[hidden]{ display:none; }
  .fs-btn:active{ background:rgba(0,0,0,.88); }
  .fs-icon{ font-size:17px; line-height:1; }

  /* 전체화면에 들어가면 버튼은 필요 없다 */
  :fullscreen .fs-btn, :-webkit-full-screen .fs-btn{ display:none; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- /view 가 아니라 /preview 를 쓰는 이유: /view 는 드라이브 화면(머리글·메뉴·
       파일 이름)까지 함께 나와 정작 영상이 작게 보인다. /preview 는 재생기만 준다. -->
  <iframe
    id="player"
    src="https://drive.google.com/file/d/12UAEnFbKgUULlw3kCqoZj86UzYUJsAdR/preview"
    allow="autoplay; fullscreen"
    allowfullscreen
    title="뚝 DOC 시연 영상"></iframe>
</div>

<button type="button" class="fs-btn" id="fsBtn" hidden>
  <span class="fs-icon" aria-hidden="true">⛶</span><span>전체화면으로 보기</span>
</button>

<script>
(function(){
  'use strict';
  var stage = document.getElementById('stage');
  var btn = document.getElementById('fsBtn');

  function requestFs(el){
    if(el.requestFullscreen) return el.requestFullscreen();
    if(el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
    return null;
  }

  /* iPhone Safari 는 임의의 요소를 전체화면으로 만들지 못한다(영상 태그만 가능).
     그런 기기에서는 버튼이 눌러도 아무 일이 없으므로 아예 보여 주지 않는다.
     대신 위의 stage 가 이미 화면 전체를 채우고 있어 그대로 크게 보인다. */
  var canFs = !!(stage.requestFullscreen || stage.webkitRequestFullscreen);
  btn.hidden = !canFs;

  btn.addEventListener('click', function(){
    /* 화면 방향은 건드리지 않는다. 이 영상은 휴대폰 화면을 세로로 녹화한
       것이라 가로로 돌리면 위아래에 검은 띠만 생기고 더 작아진다. */
    var p = requestFs(stage);
    if(p && p.catch) p.catch(function(){ /* 거부되거나 미지원이면 그대로 둔다 */ });
  });
})();
</script>
</body>
</html>
