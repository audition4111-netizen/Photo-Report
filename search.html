<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문서 보관함 조회</title>
<!-- 아이콘만 맞춰 준다. 설치 대상(manifest)은 index.html 하나로 유지한다. -->
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --primary:#ff385c; --primary-active:#e00b41; --error:#c13515;
    --ink:#222222; --muted:#6a6a6a; --hairline:#dddddd;
    --canvas:#ffffff; --surface-soft:#f7f7f7; --surface-strong:#f2f2f2;
    --radius-sm:8px; --radius-md:14px; --radius-full:9999px;
    /* 보관함 계열 색 — index.html 과 같은 값 */
    --archive:#0b6bab; --archive-soft:#eff6fb; --archive-line:#bcd9ec;
    --elevation:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:"Airbnb Cereal VF",Circular,-apple-system,system-ui,Roboto,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--canvas); color:var(--ink); -webkit-tap-highlight-color:transparent;
  }
  .shell{ max-width:900px; margin:0 auto; padding:0 16px 40px; }
  .head-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0 10px; }
  .head-logo{ height:30px; width:auto; display:block; }
  .head-banner{ height:22px; width:auto; display:block; }
  /* 아래 안내 칩들을 굵고 크게 바꾸고 나니 상대적으로 제목이 눌려 보여서 함께 키움. */
  h1{ font-size:26px; font-weight:800; letter-spacing:-0.6px; text-align:center; margin:0 0 10px; }
  .top-links{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:0 0 18px; }
  /* 눈에 잘 띄도록 키우고 진하게 — 예전엔 12px 연한 회색이라 놓치기 쉬웠다. */
  .chip{ font-size:14px; font-weight:600; color:var(--ink); background:var(--surface-soft); border:1px solid var(--hairline); border-radius:var(--radius-full); padding:8px 16px; cursor:pointer; text-decoration:none; }
  .chip[hidden]{ display:none; }
  /* 관리자 모드일 때는 색을 채워 바로 눈에 띄게 한다. */
  #adminChip{ background:var(--primary); border-color:var(--primary); color:#fff; }

  .tabs{ display:flex; gap:8px; margin:0 0 16px; }
  .tab{ flex:1; padding:12px 0; font-family:inherit; font-size:14px; font-weight:600; border:1px solid var(--hairline); border-radius:var(--radius-sm); background:var(--canvas); color:var(--muted); cursor:pointer; }
  .tab.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  /* 조회 조건은 접어 두고 필요할 때만 펼친다. 화면을 열면 결과가 먼저 보이고,
     조건을 바꿀 때만 펼치면 되므로 목록에 쓸 자리가 넓어진다. */
  /* 흰 배경이면 아래 결과 목록과 경계가 흐려 "여기가 검색 줄"임이 드러나지 않는다.
     연한 회색 판으로 깔아 두면 안의 입력칸(흰색)도 함께 또렷해진다. */
  .filters{ border:1px solid var(--hairline); border-radius:var(--radius-md); padding:14px; margin:0 0 16px; background:var(--surface-soft); }
  .filter-toggle{ display:flex; align-items:center; gap:8px; width:100%; padding:0; border:none; background:none;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer; text-align:left; }
  .filter-toggle-label{ flex:none; }
  /* 접힌 상태에서도 조건이 걸려 있는지 알 수 있게 개수를 띄운다 */
  .filter-active{ flex:none; font-size:12px; font-weight:600; color:#fff; background:var(--primary);
    border-radius:var(--radius-full); padding:2px 9px; }
  .filter-active[hidden]{ display:none; }
  /* 접혀 있을 때 "펼칠 수 있다"는 신호가 이 화살표뿐이지만, 꽉 찬 ▼ 는
     얇은 ▾ 와 달리 작아도 잘 보인다. 옆의 "조회 검색" 글자(15px)와 같은
     크기로 맞춰 튀지 않게 둔다. */
  .filter-caret{ margin-left:auto; flex:none; font-size:15px; line-height:1; color:var(--ink); transition:transform .2s ease; }
  .filters.open .filter-caret{ transform:rotate(180deg); }
  /* 0fr -> 1fr 로 두면 내용 높이를 몰라도 부드럽게 펼쳐진다 */
  .filter-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .22s ease; }
  .filters.open .filter-body{ grid-template-rows:1fr; }
  .filter-body-inner{ overflow:hidden; min-height:0; }
  .filters.open .filter-body-inner{ padding-top:14px; }
  /* 항상 2열: 지사·분야가 첫 줄, 그 아래 종류별 나머지 항목이 온다 (모바일에서도 유지). */
  .fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 10px; margin:0 0 4px; }
  .fgroup{ min-width:0; margin-bottom:0; }
  #gBranch{ order:1; }
  #gField{ order:2; }
  .fgrid.type-manual #gManualType{ order:3; }
  .fgrid.type-manual #gAuthor{ order:4; }
  .fgrid.type-manual #gFileName{ order:5; grid-column:1 / -1; }
  .fgrid.type-fault #gFacility{ order:3; }
  .fgrid.type-fault #gContent{ order:4; }
  .fgrid.type-fault #gAuthor{ order:5; }
  .fgrid.type-fault #gFileName{ order:6; }
  label{ display:block; font-size:13px; font-weight:500; color:var(--muted); margin:0 0 6px; }
  input, select{ width:100%; height:48px; padding:12px; font-family:inherit; font-size:15px; border:1px solid var(--hairline); border-radius:var(--radius-sm); background:var(--canvas); color:var(--ink); }
  input:focus, select:focus{ outline:none; border-width:2px; border-color:var(--ink); padding:11px; }
  .fbtns{ display:flex; gap:8px; margin-top:4px; }
  .fbtns button{ flex:1; height:48px; font-family:inherit; font-size:14px; font-weight:600; border-radius:var(--radius-sm); border:1px solid var(--ink); background:var(--canvas); color:var(--ink); cursor:pointer; }
  .fbtns button.primary{ background:var(--primary); border-color:var(--primary); color:#fff; }

  .status{ font-size:13.5px; color:var(--muted); margin:0 0 12px; line-height:1.6; }
  .status.err{ color:var(--error); }

  .card{ border:1px solid var(--hairline); border-radius:var(--radius-md); padding:14px; margin-bottom:10px; }
  .card-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  /* 제목과 개정번호를 한 덩어리로 묶어, 종류 배지는 계속 오른쪽 끝에 붙게 한다 */
  .card-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; min-width:0; }
  .card-title{ font-size:15px; font-weight:600; word-break:break-all; }
  .rev-chip{ flex:none; font-size:11.5px; font-weight:600; color:var(--ink); background:var(--surface-strong); border-radius:var(--radius-full); padding:2px 8px; }
  .badge{ flex:none; font-size:11px; font-weight:600; color:#fff; background:var(--ink); border-radius:var(--radius-full); padding:3px 9px; }
  .meta{ font-size:12.5px; color:var(--muted); line-height:1.7; margin-top:6px; }
  .meta b{ color:var(--ink); font-weight:600; }
  .card-actions{ margin-top:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  /* PDF 열기는 왼쪽, 개정(수정)·삭제는 오른쪽에 나란히. 좁은 화면에서는
     오른쪽 묶음이 통째로 아랫줄로 내려간다 — 묶어 두지 않으면 삭제 하나만
     떨어져 왼쪽에 붙어 어색해진다. */
  .card-actions .ca-group{ display:flex; align-items:center; gap:8px; }
  .card-actions .ca-right{ margin-left:auto; }
  .card-actions button{ height:40px; padding:0 16px; font-family:inherit; font-size:13px; font-weight:600; border-radius:var(--radius-sm); border:1px solid var(--ink); background:var(--canvas); color:var(--ink); cursor:pointer; }

  .card-actions .edit-btn{ border-color:var(--archive); color:var(--archive); background:var(--archive-soft); }
  .card-actions .del-btn{ border-color:var(--error); color:var(--error); }

  /* 비밀번호 잠금 — 화면 전체를 덮어, 풀기 전에는 목록이 보이지도 조회되지도 않는다. */
  .pw-modal{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:500;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .pw-modal[hidden]{ display:none; }
  .pw-card{ width:100%; max-width:330px; background:var(--canvas);
    border-radius:var(--radius-md); padding:26px 22px; text-align:center; }
  .pw-title{ font-size:19px; font-weight:800; color:var(--error); margin:0 0 6px; letter-spacing:-0.3px; }
  .pw-sub{ font-size:13px; color:var(--muted); margin:0 0 20px; line-height:1.6; }
  .pw-boxes{ display:flex; justify-content:center; gap:10px; margin:0 0 14px; }
  .pw-boxes input{ width:52px; height:60px; padding:0; text-align:center;
    font-family:inherit; font-size:26px; font-weight:700; color:var(--ink);
    border:2px solid var(--hairline); border-radius:var(--radius-sm);
    background:var(--canvas); -webkit-appearance:none; appearance:none; }
  .pw-boxes input:focus{ outline:none; border-color:var(--ink); }
  .pw-boxes input.filled{ border-color:var(--ink); }
  .pw-msg{ font-size:13px; color:var(--error); min-height:19px; margin:0; }
  /* 틀렸을 때 좌우로 한 번 흔들어 바로 알아채게 한다 */
  .pw-card.shake{ animation:pw-shake .3s; }
  @keyframes pw-shake{ 0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-7px); } 75%{ transform:translateX(7px); } }

  /* 삭제 확인 — 문서 비밀번호를 받는다. 작성 화면의 팝업과 같은 모양. */
  .delpw-modal{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:490;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .delpw-modal[hidden]{ display:none; }
  .delpw-card{ width:100%; max-width:330px; background:var(--canvas);
    border-radius:var(--radius-md); padding:24px 22px; text-align:center; }
  .delpw-title{ font-size:18px; font-weight:800; color:var(--error); margin:0 0 6px; letter-spacing:-0.3px; }
  .delpw-doc{ font-size:14px; font-weight:700; color:var(--archive); margin:0 0 18px;
    word-break:break-all; line-height:1.4; }
  .delpw-boxes{ display:flex; justify-content:center; gap:10px; margin:0 0 16px; }
  .delpw-boxes input{ width:52px; height:60px; padding:0; text-align:center;
    font-family:inherit; font-size:26px; font-weight:700; color:var(--ink);
    border:2px solid var(--hairline); border-radius:var(--radius-sm);
    background:var(--canvas); -webkit-appearance:none; appearance:none; }
  .delpw-boxes input:focus{ outline:none; border-color:var(--ink); }
  .delpw-boxes input.filled{ border-color:var(--ink); }
  .delpw-note{ font-size:13px; color:var(--muted); margin:0 0 6px; line-height:1.5; }
  .delpw-msg{ font-size:13px; color:var(--error); min-height:19px; margin:0 0 14px; }
  .delpw-btns{ display:flex; gap:10px; }
  .delpw-btns button{ flex:1; height:46px; font-family:inherit; font-size:15px; font-weight:700;
    border-radius:var(--radius-sm); cursor:pointer; }
  .delpw-cancel{ border:1px solid var(--hairline); background:var(--canvas); color:var(--ink); }
  .delpw-go{ border:1px solid var(--error); background:var(--error); color:#fff; }
  .delpw-card.shake{ animation:delpw-shake .3s; }
  @keyframes delpw-shake{ 0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-7px); } 75%{ transform:translateX(7px); } }

  /* 수정 전 확인 팝업 — 어떤 문서를 고치는지 제목을 먼저 보여 준다. */
  .ask-modal{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:480;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .ask-modal[hidden]{ display:none; }
  .ask-card{ width:100%; max-width:340px; background:var(--canvas);
    border-radius:var(--radius-md); padding:24px 22px; text-align:center; }
  .ask-title{ font-size:16px; font-weight:700; color:var(--ink); margin:0 0 10px; }
  .ask-name{ font-size:15px; font-weight:700; color:var(--archive); margin:0 0 10px;
    word-break:break-all; line-height:1.5; }
  .ask-note{ font-size:13px; color:var(--muted); margin:0 0 20px; line-height:1.6; }
  .ask-btns{ display:flex; gap:10px; }
  .ask-btns button{ flex:1; height:46px; font-family:inherit; font-size:15px; font-weight:700;
    border-radius:var(--radius-sm); cursor:pointer; }
  .ask-no{ border:1px solid var(--hairline); background:var(--canvas); color:var(--ink); }
  .ask-yes{ border:1px solid var(--archive); background:var(--archive); color:#fff; }

  .gate{ border:1px solid var(--hairline); border-radius:var(--radius-md); padding:20px; }
  .gate h2{ font-size:16px; font-weight:600; margin:0 0 6px; }
  .gate p{ font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 14px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<!-- 비밀번호 잠금. 풀기 전에는 아래 내용을 조회하지 않는다. -->
<div class="pw-modal" id="pwModal" hidden>
  <div class="pw-card" id="pwCard">
    <p class="pw-title">관계자 외 열람금지</p>
    <p class="pw-sub">비밀번호를 입력해 주세요</p>
    <div class="pw-boxes" id="pwBoxes">
      <input type="text" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="비밀번호 1번째 자리">
      <input type="text" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="비밀번호 2번째 자리">
      <input type="text" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="비밀번호 3번째 자리">
      <input type="text" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="비밀번호 4번째 자리">
    </div>
    <p class="pw-msg" id="pwMsg"></p>
  </div>
</div>

<!-- 삭제 전 확인 — 문서 비밀번호 -->
<div class="delpw-modal" id="delPwModal" hidden>
  <div class="delpw-card" id="delPwCard">
    <p class="delpw-title">삭제</p>
    <p class="delpw-doc" id="delPwDoc"></p>
    <div class="delpw-boxes" id="delPwBoxes">
      <input type="text" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="문서 비밀번호 1번째 자리">
      <input type="text" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="문서 비밀번호 2번째 자리">
      <input type="text" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="문서 비밀번호 3번째 자리">
      <input type="text" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="문서 비밀번호 4번째 자리">
    </div>
    <p class="delpw-note">되돌릴 수 없습니다</p>
    <p class="delpw-msg" id="delPwMsg"></p>
    <div class="delpw-btns">
      <button type="button" class="delpw-cancel" id="delPwCancel">취소</button>
      <button type="button" class="delpw-go" id="delPwGo">삭제</button>
    </div>
  </div>
</div>

<!-- 수정 전 확인 -->
<div class="ask-modal" id="askModal" hidden>
  <div class="ask-card">
    <p class="ask-title" id="askTitle">이 문서를 수정합니다</p>
    <p class="ask-name" id="askName"></p>
    <p class="ask-note">작성 화면으로 넘어갑니다.<br>수정 후에는 지금 문서에 덮어쓰기 됩니다.</p>
    <div class="ask-btns">
      <button type="button" class="ask-no" id="askNo">아니오</button>
      <button type="button" class="ask-yes" id="askYes">예</button>
    </div>
  </div>
</div>

<div class="shell">
  <div class="head-row">
    <img src="manual-logo.gif" alt="한국지역난방공사" class="head-logo">
    <img src="banner.png" alt="깨끗한 에너지로 세상을 따뜻하게" class="head-banner">
  </div>
  <h1>문서 보관함</h1>
  <div class="top-links">
    <a class="chip" href="index.html">← 문서 작성으로</a>
    <!-- 관리자로 로그인되어 있을 때만 보인다(index.html에서 로그인하면 세션이 공유된다). -->
    <span class="chip" id="adminChip" hidden></span>
  </div>

  <!-- 미설정 안내 -->
  <div class="gate hidden" id="notConfigured">
    <h2>보관함이 아직 연결되지 않았습니다</h2>
    <p>
      <code>supabase-config.js</code> 에 Supabase 프로젝트 URL과 anon 키를 입력하면
      조회 기능이 켜집니다. 설정 방법은 <code>SUPABASE-SETUP.md</code> 를 참고해 주세요.
    </p>
  </div>

  <!-- 조회 (로그인 없이 바로 시작한다) -->
  <div id="browser" class="hidden">
    <div class="tabs">
      <button type="button" class="tab active" data-type="manual">매뉴얼</button>
      <button type="button" class="tab" data-type="fault">고장 보고서</button>
    </div>

    <div class="filters" id="filters">
      <button type="button" class="filter-toggle" id="filterToggleBtn" aria-expanded="false" aria-controls="filterBody">
        <span class="filter-toggle-label">조회 검색</span>
        <span class="filter-active" id="filterActive" hidden></span>
        <span class="filter-caret" aria-hidden="true">▼</span>
      </button>

      <div class="filter-body" id="filterBody">
      <div class="filter-body-inner">
      <!-- 첫 줄: 지사·분야 (공통). 그 아래는 종류에 따라 배치가 바뀐다. -->
      <div class="fgrid" id="fgrid">
        <div class="fgroup" id="gBranch">
          <label for="fBranch">지사</label>
          <select id="fBranch"><option value="">전체</option></select>
        </div>
        <div class="fgroup" id="gField">
          <label for="fField">분야</label>
          <select id="fField"><option value="">전체</option></select>
        </div>
        <div class="fgroup" id="gManualType">
          <label for="fManualType">매뉴얼 종류</label>
          <select id="fManualType">
            <option value="">전체</option>
            <option value="업무 매뉴얼">업무 매뉴얼</option>
            <option value="조작 매뉴얼">조작 매뉴얼</option>
            <option value="운전 매뉴얼">운전 매뉴얼</option>
            <option value="점검 매뉴얼">점검 매뉴얼</option>
            <option value="정비 매뉴얼">정비 매뉴얼</option>
          </select>
        </div>
        <!-- 고장 보고서 전용 -->
        <div class="fgroup" id="gFacility">
          <label for="fFacility">설비명</label>
          <input type="text" id="fFacility" placeholder="예: 변압기">
        </div>
        <div class="fgroup" id="gContent">
          <label for="fContent">고장내용</label>
          <input type="text" id="fContent" placeholder="예: 방압변">
        </div>
        <!-- 매뉴얼·고장 보고서 공통 -->
        <div class="fgroup" id="gAuthor">
          <label for="fAuthor">작성자</label>
          <input type="text" id="fAuthor" placeholder="작성자 이름 일부 입력">
        </div>
        <div class="fgroup" id="gFileName">
          <label for="fFileName">파일명</label>
          <input type="text" id="fFileName" placeholder="파일명 일부 입력">
        </div>
      </div>

      <div class="fbtns">
        <button type="button" id="resetBtn">초기화</button>
        <button type="button" class="primary" id="searchBtn">조회</button>
      </div>
      </div>
      </div>
    </div>

    <p class="status" id="status"></p>
    <div id="results"></div>
  </div>
</div>

<script src="libs/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="archive.js"></script>
<script>
(function(){
  'use strict';

  // 작성 화면(index.html)의 목록과 같아야 한다. 빠진 항목이 있으면 그 값으로 저장한
  // 문서를 조회로 걸러낼 수 없다.
  var MANUAL_FIELDS = ['전기','기계','제어','전산','운영','건축','토목','화공','사무','기타'];
  var FAULT_FIELDS  = ['전기','기계','제어','전산','운영','열수송','기타'];
  var BRANCHES = [
    '중앙지사','강남지사','파주지사','삼송지사','고양사업소','화성지사',
    '동탄지사','판교지사','광교지사','용인지사','분당사업소','평택지사',
    '광주전남지사','양산지사','대구지사','세종지사','김해사업소','청주지사'
  ];
  // '기타'는 가나다순이면 중간에 끼므로 맨 아래로 내린다 (작성 화면과 같은 규칙).
  var LAST_OPTIONS = ['기타'];

  function sortKorean(values){
    var head = values.filter(function(v){ return LAST_OPTIONS.indexOf(v) === -1; });
    var tail = values.filter(function(v){ return LAST_OPTIONS.indexOf(v) !== -1; });
    head.sort(function(a, b){ return a.localeCompare(b, 'ko'); });
    return head.concat(tail);
  }

  var el = function(id){ return document.getElementById(id); };
  var notConfigured = el('notConfigured'), browser = el('browser');
  var statusEl = el('status'), resultsEl = el('results'), adminChip = el('adminChip');
  var currentType = 'manual';   // 첫 탭
  var currentUser = null;       // 관리자로 로그인했을 때만 채워진다(일반 사용자는 로그인 없음)

  function show(node, on){ node.classList.toggle('hidden', !on); }

  function setStatus(text, isErr){
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }

  function fillSelect(id, values){
    var sel = el(id);
    var keep = sel.value;
    sel.innerHTML = '<option value="">전체</option>';
    sortKorean(values).forEach(function(v){
      var o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
    // 탭을 바꿔도 같은 값이 남아 있으면 유지한다
    if(keep && values.indexOf(keep) !== -1) sel.value = keep;
  }

  function fillFieldOptions(){
    fillSelect('fField', currentType === 'fault' ? FAULT_FIELDS : MANUAL_FIELDS);
  }

  /* 조회 조건 접기/펼치기.
     처음에는 접힌 채로 두어 결과가 먼저 보이게 하고, 조건을 만질 때만 편다. */
  var filtersEl = el('filters');
  var filterToggleBtn = el('filterToggleBtn');
  var filterActiveEl = el('filterActive');

  function setFiltersOpen(open){
    filtersEl.classList.toggle('open', open);
    filterToggleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  /* 접혀 있으면 어떤 조건이 걸렸는지 보이지 않으므로 개수를 배지로 알린다.
     지금 종류에서 실제로 쓰이는(화면에 보이는) 칸만 센다. */
  function refreshFilterCount(){
    var used = ['fBranch','fField','fManualType','fFacility','fContent','fAuthor','fFileName'].filter(function(id){
      var group = el(id).closest('.fgroup');
      if(group && group.classList.contains('hidden')) return false;
      return el(id).value.trim() !== '';
    });
    filterActiveEl.hidden = used.length === 0;
    filterActiveEl.textContent = used.length + '개 적용';
  }

  filterToggleBtn.addEventListener('click', function(){
    setFiltersOpen(!filtersEl.classList.contains('open'));
  });

  function applyTypeVisibility(){
    el('fgrid').className = 'fgrid type-' + currentType;
    show(el('gManualType'), currentType === 'manual');
    show(el('gFacility'), currentType === 'fault');
    show(el('gContent'), currentType === 'fault');
    fillFieldOptions();
    fillSelect('fBranch', BRANCHES);   // 지사는 두 종류 공통
    refreshFilterCount();
  }

  function fmtDateTime(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    var pad = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '.' + (d.getMonth()+1) + '.' + d.getDate() + '. ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /* 두 시각의 차이. 정지기간처럼 저장하지 않고 그때그때 계산하는 값에 쓴다
     (occurred_at·outage_at·recover_at 로 구할 수 있어 컬럼을 늘릴 필요가 없다). */
  function spanText(fromIso, toIso){
    if(!fromIso || !toIso) return '';
    var a = new Date(fromIso), b = new Date(toIso);
    if(isNaN(a.getTime()) || isNaN(b.getTime())) return '';
    var mins = Math.round((b.getTime() - a.getTime()) / 60000);
    if(mins < 0) return '';
    return Archive.minutesToText(mins);
  }

  function metaLine(label, value){
    if(!value) return '';
    return '<div>' + label + ' <b>' + String(value).replace(/[<>&]/g, function(c){
      return { '<':'&lt;', '>':'&gt;', '&':'&amp;' }[c];
    }) + '</b></div>';
  }

  /* 로그인이 없어 작성자 입력칸에 누구나 아무 이름이나 적을 수 있으므로, 목록에
     실명을 그대로 보여주지 않고 앞·뒤 한 글자만 남기고 가운데를 가린다.
     "김철수" -> "김*수", "김철수민" -> "김**민". 두 글자(외자 이름)는 예외로
     성 뒤에 별표 하나만 붙인다: "김철" -> "김*". */
  function maskAuthorName(name){
    var s = String(name || '').trim();
    if(s.length <= 1) return s;
    if(s.length === 2) return s.charAt(0) + '*';
    return s.charAt(0) + new Array(s.length - 1).join('*') + s.charAt(s.length - 1);
  }

  // 개정번호는 text 컬럼이라 그대로 정렬하면 '10' 이 '3' 보다 앞에 온다. 숫자로 본다.
  function revNumber(v){
    var n = parseInt(String(v || '').replace(/[^0-9]/g, ''), 10);
    return isNaN(n) ? -1 : n;
  }

  function compareKorean(a, b){
    return String(a || '').localeCompare(String(b || ''), 'ko');
  }

  // 매뉴얼: 작성일자(최신순)가 가장 먼저고, 그 다음에 원래대로 지사-분야-종류-제목
  // 순으로 묶는다. 같은 제목이면 개정번호가 높은 쪽을 위로.
  function sortManualRows(rows){
    return rows.slice().sort(function(a, b){
      return (new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime())
        || compareKorean(a.branch, b.branch)
        || compareKorean(a.field, b.field)
        || compareKorean(a.manual_type, b.manual_type)
        || compareKorean(a.file_name, b.file_name)
        || (revNumber(b.revision) - revNumber(a.revision));
    });
  }

  // 고장 보고서: 작성일자(최신순)가 가장 먼저고, 그 다음에 원래대로 지사-분야-
  // 설비명-제목 순으로 묶는다. 같은 제목이면 개정번호가 높은 쪽을 위로.
  function sortFaultRows(rows){
    return rows.slice().sort(function(a, b){
      return (new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime())
        || compareKorean(a.branch, b.branch)
        || compareKorean(a.field, b.field)
        || compareKorean(a.facility, b.facility)
        || compareKorean(a.file_name, b.file_name)
        || (revNumber(b.revision) - revNumber(a.revision));
    });
  }

  function renderRow(row){
    var card = document.createElement('div');
    card.className = 'card';

    /* 파일명은 카드 제목으로 이미 보이므로 목록에서 빼고, 종류별로 정해진 순서대로
       쌓는다. 작성자·작성일이 맨 뒤인 것도 그 순서에 맞춘 것. 작성자 이름은
       익명성을 위해 가운데를 가려서 보여준다(maskAuthorName). */
    var meta = '';

    if(row.doc_type === 'manual'){
      meta += metaLine('분야', row.field ? row.field + '분야' : '');
      meta += metaLine('종류', row.manual_type);
      meta += metaLine('작성자', maskAuthorName(row.author_name));
      meta += metaLine('작성일', fmtDateTime(row.created_at));
    }else if(row.doc_type === 'fault'){
      meta += metaLine('고장분야', row.field ? row.field + '분야' : '');
      meta += metaLine('설비명', row.facility);
      meta += metaLine('고장내용', row.fault_content);
      meta += metaLine('발생일시', fmtDateTime(row.occurred_at));
      // 복구일시를 고르지 않고 "미정" 처럼 직접 적은 경우도 있다
      meta += metaLine('복구일시', fmtDateTime(row.recover_at) || row.recover_note);
      meta += metaLine('정지기간', spanText(row.occurred_at, row.recover_at));
      meta += metaLine('열공급 정지기간',
        row.outage_none ? '해당없음' : spanText(row.outage_at, row.recover_at));
      meta += metaLine('작성자', maskAuthorName(row.author_name));
      meta += metaLine('작성일', fmtDateTime(row.created_at));
    }

    // 개정번호는 제목 옆에 붙여 목록을 훑으면서 바로 판별할 수 있게 한다
    var revChip = (row.doc_type === 'manual' && row.revision)
      ? '<span class="rev-chip"></span>' : '';

    /* 삭제 버튼은 모두에게 보인다. 실제로 지울 수 있는지는 문서 비밀번호가
       가린다(관리자는 비밀번호 없이). 예전 문서처럼 비밀번호가 없는 건은
       눌렀을 때 관리자만 가능하다고 알려 준다. */
    var canDel = true;
    // 원본 꾸러미가 있는 문서만 고칠 수 있다(이 기능이 생기기 전 자료에는 없다)
    var canEdit = Archive.canEdit(row);
    // 매뉴얼은 고치면 개정번호가 올라가므로 "개정"이 더 맞는 말이다
    var editLabel = row.doc_type === 'manual' ? '개정' : '수정';


    card.innerHTML =
      '<div class="card-top">' +
        '<span class="card-head">' +
          '<span class="card-title"></span>' + revChip +
        '</span>' +
        '<span class="badge"></span>' +
      '</div>' +
      '<div class="meta">' + meta + '</div>' +
      '<div class="card-actions">' +
        '<div class="ca-group ca-left">' +
          '<button type="button" class="pdf-btn">PDF 열기</button>' +
        '</div>' +
        ((canEdit || canDel) ?
          '<div class="ca-group ca-right">' +
            (canEdit ? '<button type="button" class="edit-btn">' + editLabel + '</button>' : '') +
            (canDel ? '<button type="button" class="del-btn">삭제</button>' : '') +
          '</div>' : '') +
      '</div>';

    card.querySelector('.card-title').textContent = row.file_name;
    card.querySelector('.badge').textContent = row.branch || '';
    if(revChip) card.querySelector('.rev-chip').textContent = '개정 ' + row.revision;

    var btn = card.querySelector('.pdf-btn');
    btn.addEventListener('click', function(){
      btn.disabled = true;
      Archive.signedUrl(row.pdf_path).then(function(url){
        btn.disabled = false;
        window.open(url, '_blank');
      }).catch(function(err){
        btn.disabled = false;
        console.error(err);
        setStatus('PDF를 열지 못했습니다: ' + (err.message || ''), true);
      });
    });

    var editBtn = card.querySelector('.edit-btn');
    if(editBtn){
      editBtn.addEventListener('click', function(){
        askEdit(row.file_name || row.title || '문서', editLabel, function(){
          /* 원본 꾸러미는 수 MB 라 주소나 세션에 실어 보내지 않는다. 문서 id 만
             넘기고 작성 화면이 직접 받아 가게 한다. */
          try{
            sessionStorage.setItem('ddoc-edit-doc-id', row.id);
          }catch(e){
            setStatus('이 브라우저에서는 수정 기능을 사용할 수 없습니다.', true);
            return;
          }
          location.href = 'index.html';
        });
      });
    }

    var delBtn = card.querySelector('.del-btn');
    if(delBtn){
      delBtn.addEventListener('click', function(){
        askDelete(row, card, delBtn);
      });
    }
    return card;
  }

  /* ---- 삭제 (문서 비밀번호) ------------------------------------------------
     로그인이 없어 서버가 사람을 구분하지 못하므로, 문서를 만들 때 걸어 둔 네
     자리를 맞춰야 지워진다. 관리자로 로그인한 경우에는 묻지 않고 바로 지운다.
     맞는지 따지는 일은 모두 서버가 한다 — 여기서는 받아서 넘길 뿐이다. */
  var DOC_PW_KEY = 'ddoc-doc-pw';
  var delPwModal = el('delPwModal');
  var delPwCard = el('delPwCard');
  var delPwDocEl = el('delPwDoc');
  var delPwMsg = el('delPwMsg');
  var delPwGoBtn = el('delPwGo');
  var delPwCancelBtn = el('delPwCancel');
  var delPwInputs = Array.prototype.slice.call(document.querySelectorAll('#delPwBoxes input'));
  var delTarget = null;   // { row, card, btn }

  function rememberedDocPw(){
    try{
      var v = localStorage.getItem(DOC_PW_KEY) || '';
      return /^[0-9]{4}$/.test(v) ? v : '';
    }catch(e){ return ''; }
  }

  function delPwValue(){
    return delPwInputs.map(function(i){ return i.value; }).join('');
  }

  function fillDelPw(v){
    for(var i = 0; i < delPwInputs.length; i++){
      delPwInputs[i].value = v.charAt(i) || '';
      delPwInputs[i].classList.toggle('filled', !!delPwInputs[i].value);
    }
  }

  function shakeDelPw(msg){
    delPwMsg.textContent = msg;
    delPwCard.classList.remove('shake');
    void delPwCard.offsetWidth;
    delPwCard.classList.add('shake');
  }

  delPwInputs.forEach(function(input, idx){
    input.addEventListener('input', function(){
      input.value = input.value.replace(/[^0-9]/g, '').slice(-1);
      input.classList.toggle('filled', input.value !== '');
      delPwMsg.textContent = '';
      if(input.value && idx < delPwInputs.length - 1) delPwInputs[idx + 1].focus();
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Backspace' && !input.value && idx > 0){
        e.preventDefault();
        delPwInputs[idx - 1].value = '';
        delPwInputs[idx - 1].classList.remove('filled');
        delPwInputs[idx - 1].focus();
        return;
      }
      if(e.key === 'Enter') delPwGoBtn.click();
    });
  });

  function closeDelPw(){
    delPwModal.hidden = true;
    if(delTarget && delTarget.btn) delTarget.btn.disabled = false;
    delTarget = null;
  }

  delPwCancelBtn.addEventListener('click', closeDelPw);
  delPwModal.addEventListener('click', function(e){
    if(e.target === delPwModal) closeDelPw();
  });

  function askDelete(row, card, btn){
    // 관리자는 비밀번호를 묻지 않는다
    if(Archive.canDelete(currentUser)){
      if(!window.confirm('"' + (row.file_name || '문서') + '" 를 삭제하시겠습니까?')) return;
      btn.disabled = true;
      /* 관리자는 예전 경로를 그대로 쓴다. 문서 비밀번호 기능을 위한 SQL 을
         아직 실행하지 않았더라도 관리자 삭제는 끊기지 않게 하려는 것이다. */
      Archive.deleteDocument(row).then(function(res){
        card.remove();
        if(res && res.fileRemoved === false){
          setStatus('문서는 삭제했지만 저장된 PDF 파일은 지우지 못했습니다. '
            + 'Storage 삭제 권한을 확인해 주세요.', true);
          return;
        }
        showStatusAfterDelete();
      }).catch(function(err){
        btn.disabled = false;
        console.error(err);
        setStatus('삭제하지 못했습니다: ' + (err.message || ''), true);
      });
      return;
    }
    if(!row.pw_set){
      setStatus('이 문서는 비밀번호가 없어 관리자만 삭제할 수 있습니다.', true);
      return;
    }
    delTarget = { row: row, card: card, btn: btn };
    btn.disabled = true;
    delPwDocEl.textContent = row.file_name || row.title || '문서';
    delPwMsg.textContent = '';
    fillDelPw(rememberedDocPw());
    delPwModal.hidden = false;
    setTimeout(function(){
      var next = delPwInputs.filter(function(i){ return !i.value; })[0] || delPwInputs[0];
      next.focus();
    }, 60);
  }

  var DELETE_FAIL_MESSAGE = {
    wrong: '비밀번호가 맞지 않습니다.',
    locked: '여러 번 틀려 잠겼습니다. 10분 뒤에 다시 시도해 주세요.',
    admin_only: '이 문서는 비밀번호가 없어 관리자만 삭제할 수 있습니다.',
    not_found: '이미 삭제된 문서입니다.'
  };

  function runDelete(row, card, btn, password){
    return Archive.deleteDocumentByPassword(row, password).then(function(res){
      if(!res.ok){
        if(delTarget){
          shakeDelPw(DELETE_FAIL_MESSAGE[res.reason] || '삭제하지 못했습니다.');
          if(res.reason !== 'wrong') setTimeout(closeDelPw, 1600);
        }else{
          btn.disabled = false;
          setStatus(DELETE_FAIL_MESSAGE[res.reason] || '삭제하지 못했습니다.', true);
        }
        if(res.reason === 'not_found') card.remove();
        return;
      }
      closeDelPw();
      card.remove();
      /* 행은 지워졌는데 저장된 PDF 가 남은 경우를 조용히 넘기지 않는다. */
      if(res.fileRemoved === false){
        setStatus('문서는 삭제했지만 저장된 PDF 파일은 지우지 못했습니다. '
          + 'Storage 삭제 권한을 확인해 주세요.', true);
        return;
      }
      showStatusAfterDelete();
    }).catch(function(err){
      console.error(err);
      if(delTarget) shakeDelPw((err && err.message) || '삭제하지 못했습니다.');
      else{
        btn.disabled = false;
        setStatus('삭제하지 못했습니다: ' + (err.message || ''), true);
      }
    });
  }

  delPwGoBtn.addEventListener('click', function(){
    if(!delTarget) return;
    var v = delPwValue();
    if(!/^[0-9]{4}$/.test(v)){
      shakeDelPw('네 자리를 모두 입력해 주세요.');
      return;
    }
    var t = delTarget;
    delPwGoBtn.disabled = true;
    runDelete(t.row, t.card, t.btn, v).then(function(){
      delPwGoBtn.disabled = false;
    });
  });

  /* 예/아니오 확인 팝업. window.confirm 은 버튼 글자가 확인/취소로 고정이라
     직접 만든다. */
  var askModal = el('askModal');
  var askTitleEl = el('askTitle');
  var askNameEl = el('askName');
  var askYesBtn = el('askYes');
  var askNoBtn = el('askNo');
  var askAccept = null;

  function closeAsk(){
    askModal.hidden = true;
    askAccept = null;
  }

  function askEdit(name, label, onYes){
    askTitleEl.textContent = '이 문서를 ' + label + '합니다';
    askNameEl.textContent = name;
    askAccept = onYes;
    askModal.hidden = false;
    askYesBtn.focus();
  }

  askYesBtn.addEventListener('click', function(){
    var run = askAccept;
    closeAsk();
    if(run) run();
  });
  askNoBtn.addEventListener('click', closeAsk);
  // 바깥 어두운 곳을 누르면 닫힌다(카드 안쪽을 누른 것은 제외)
  askModal.addEventListener('click', function(e){
    if(e.target === askModal) closeAsk();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !askModal.hidden) closeAsk();
  });

  function showStatusAfterDelete(){
    var left = resultsEl.querySelectorAll('.card').length;
    setStatus(left === 0 ? '조건에 맞는 문서가 없습니다.' : left + '건을 찾았습니다.');
  }

  function runSearch(){
    refreshFilterCount();
    setStatus('조회 중입니다...');
    resultsEl.innerHTML = '';

    var filters = {
      docType: currentType,
      fileName: el('fFileName').value.trim(),
      authorName: el('fAuthor').value.trim(),
      field: el('fField').value,
      branch: el('fBranch').value
    };
    if(currentType === 'manual') filters.manualType = el('fManualType').value;
    if(currentType === 'fault'){
      filters.facility = el('fFacility').value.trim();
      filters.faultContent = el('fContent').value.trim();
    }

    Archive.queryDocuments(filters).then(function(rows){
      if(rows.length === 0){
        setStatus('조건에 맞는 문서가 없습니다.');
        return;
      }
      setStatus(rows.length + '건을 찾았습니다.');
      rows = currentType === 'manual' ? sortManualRows(rows) : sortFaultRows(rows);
      var frag = document.createDocumentFragment();
      rows.forEach(function(r){ frag.appendChild(renderRow(r)); });
      resultsEl.appendChild(frag);
    }).catch(function(err){
      console.error(err);
      setStatus('조회에 실패했습니다: ' + (err.message || ''), true);
    });
  }

  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      currentType = tab.dataset.type;
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t === tab); });
      applyTypeVisibility();
      resultsEl.innerHTML = '';
      setStatus('');
      runSearch();
    });
  });

  el('searchBtn').addEventListener('click', runSearch);
  el('resetBtn').addEventListener('click', function(){
    ['fFileName','fAuthor','fFacility','fContent','fBranch','fManualType','fField'].forEach(function(id){
      el(id).value = '';
    });
    runSearch();
  });

  // 관리자 세션이 있으면(index.html에서 로그인한 세션이 공유됨) 삭제 버튼이
  // 보이도록 조용히 반영한다 — 일반 사용자는 로그인 UI 자체를 볼 일이 없다.
  function applyAdminState(user){
    currentUser = user;
    var isAdmin = !!(window.Archive && Archive.isAdmin(user));
    adminChip.hidden = !isAdmin;
    if(isAdmin){
      adminChip.textContent = '관리자 모드';
      runSearch();   // 삭제 버튼을 반영해 다시 그린다
    }
  }

  // 비밀번호를 풀고 나서야 실행된다. 그 전에는 조회 요청을 한 번도 보내지 않는다.
  function startBrowsing(){
    if(!window.Archive || !Archive.isEnabled()){
      show(notConfigured, true);
      return;
    }
    show(browser, true);
    applyTypeVisibility();
    runSearch();
    Archive.currentUser().then(applyAdminState).catch(function(){ applyAdminState(null); });
  }

  /* ---- 비밀번호 잠금 --------------------------------------------------
     주의: 화면 앞단을 막는 잠금장치다. 비밀번호가 이 파일 안에 들어 있어
     소스를 열어 보면 보이므로, 외부인이 우연히 들어오는 것을 막는 용도다.
     실제 데이터 보호는 Supabase 의 RLS 정책이 담당한다.
     한 번 풀면 그 탭을 닫을 때까지는 다시 묻지 않는다(sessionStorage). */
  var PASSCODE = '2488';
  var PASS_KEY = 'ddoc-archive-unlocked';
  var pwModal = el('pwModal');
  var pwCard = el('pwCard');
  var pwMsg = el('pwMsg');
  var pwInputs = Array.prototype.slice.call(document.querySelectorAll('#pwBoxes input'));

  function pwValue(){
    return pwInputs.map(function(i){ return i.value; }).join('');
  }

  function pwClear(focus){
    pwInputs.forEach(function(i){ i.value = ''; i.classList.remove('filled'); });
    if(focus !== false) pwInputs[0].focus();
  }

  function unlock(){
    try{ sessionStorage.setItem(PASS_KEY, '1'); }catch(e){ /* 시크릿 모드 등 */ }
    pwModal.hidden = true;
    startBrowsing();
  }

  function tryPasscode(){
    if(pwValue() === PASSCODE){ unlock(); return; }
    pwMsg.textContent = '비밀번호가 맞지 않습니다.';
    pwCard.classList.remove('shake');
    void pwCard.offsetWidth;        // 애니메이션을 다시 돌리려면 한 번 끊어 줘야 한다
    pwCard.classList.add('shake');
    setTimeout(function(){ pwClear(true); }, 280);
  }

  pwInputs.forEach(function(input, idx){
    input.addEventListener('input', function(){
      // 숫자만 남긴다(한글 자판이나 붙여넣기로 다른 글자가 들어올 수 있다)
      var v = input.value.replace(/[^0-9]/g, '');
      input.value = v.slice(-1);
      input.classList.toggle('filled', input.value !== '');
      pwMsg.textContent = '';
      // 한 자를 넣으면 자동으로 다음 칸으로 넘어간다
      if(input.value && idx < pwInputs.length - 1) pwInputs[idx + 1].focus();
      if(pwValue().length === pwInputs.length) tryPasscode();
    });
    input.addEventListener('keydown', function(e){
      // 빈 칸에서 지우기를 누르면 앞 칸으로 돌아가 지운다
      if(e.key === 'Backspace' && !input.value && idx > 0){
        e.preventDefault();
        pwInputs[idx - 1].value = '';
        pwInputs[idx - 1].classList.remove('filled');
        pwInputs[idx - 1].focus();
        return;
      }
      if(e.key === 'ArrowLeft' && idx > 0){ e.preventDefault(); pwInputs[idx - 1].focus(); }
      if(e.key === 'ArrowRight' && idx < pwInputs.length - 1){ e.preventDefault(); pwInputs[idx + 1].focus(); }
      if(e.key === 'Enter' && pwValue().length === pwInputs.length) tryPasscode();
    });
    // 네 자리를 한 번에 붙여넣는 경우
    input.addEventListener('paste', function(e){
      var data = e.clipboardData || window.clipboardData;
      var text = data ? (data.getData('text') || '') : '';
      var digits = text.replace(/[^0-9]/g, '').slice(0, pwInputs.length);
      if(!digits) return;
      e.preventDefault();
      pwClear(false);
      for(var k = 0; k < digits.length; k++){
        pwInputs[k].value = digits.charAt(k);
        pwInputs[k].classList.add('filled');
      }
      pwInputs[Math.min(digits.length, pwInputs.length - 1)].focus();
      if(digits.length === pwInputs.length) tryPasscode();
    });
  });

  // 잠금창 아무 곳을 눌러도 입력칸으로 초점이 가게 한다
  pwModal.addEventListener('click', function(){
    if(pwModal.hidden) return;
    var next = null;
    for(var k = 0; k < pwInputs.length; k++){
      if(!pwInputs[k].value){ next = pwInputs[k]; break; }
    }
    (next || pwInputs[pwInputs.length - 1]).focus();
  });

  // ---- 시작 ----
  var unlocked = false;
  try{ unlocked = sessionStorage.getItem(PASS_KEY) === '1'; }catch(e){}
  if(unlocked){
    startBrowsing();
  }else{
    pwModal.hidden = false;
    setTimeout(function(){ pwInputs[0].focus(); }, 60);
  }
})();
</script>
</body>
</html>
